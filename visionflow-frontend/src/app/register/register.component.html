<div class="register-container">
    <div class="register-card">

        <div class="card-header">
            <div class="brand">
                <div class="brand-icon">👁</div>
                <span class="brand-name">VisionFlow</span>
            </div>
            <h2>Create an account</h2>
            <p>Join VisionFlow to manage your vision therapy</p>
        </div>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

            <!-- Role selector -->
            <div class="role-selector">
                <button type="button"
                    class="role-btn"
                    [class.active]="payload.role === 'PATIENT'"
                    (click)="payload.role = 'PATIENT'">
                    🧑‍⚕️ Patient
                </button>
                <button type="button"
                    class="role-btn"
                    [class.active]="payload.role === 'DOCTOR'"
                    (click)="payload.role = 'DOCTOR'">
                    👨‍⚕️ Doctor
                </button>
            </div>

            <!-- Name row -->
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" [(ngModel)]="payload.firstName"
                        required placeholder="John" />
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" [(ngModel)]="payload.lastName"
                        required placeholder="Doe" />
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" [(ngModel)]="payload.email"
                    required placeholder="john@example.com" />
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" [(ngModel)]="payload.phone"
                    required placeholder="+1 234 567 8900" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" name="password"
                        [(ngModel)]="payload.password" required placeholder="Create a strong password" />
                    <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                        {{ showPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" [disabled]="isLoading || !registerForm.valid">
                {{ isLoading ? 'Creating account...' : 'Create Account' }}
            </button>

        </form>

        <p class="login-link">
            Already have an account? <a routerLink="/login">Sign in</a>
        </p>

    </div>
</div>
