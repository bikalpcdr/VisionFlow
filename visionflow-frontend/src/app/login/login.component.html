<div class="login-container">
    <div class="login-card">
        <h2>VisionFlow</h2>
        <p class="subtitle">Sign in to your account</p>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="credentials.email" required
                    placeholder="Enter your email" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        [(ngModel)]="credentials.password" required placeholder="Enter your password" />
                    <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                        {{ showPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" [disabled]="isLoading || !loginForm.valid">
                {{ isLoading ? 'Signing in...' : 'Sign In' }}
            </button>
        </form>

        <p class="register-link">
            Don't have an account? <a routerLink="/register">Create one</a>
        </p>
    </div>
</div>
