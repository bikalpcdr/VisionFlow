spring:
  application:
    name: visionflow

  # ===== DataSource =====
  datasource:
    url: jdbc:postgresql://localhost:5432/visionflow
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VisionFlowHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: create          # Drop and recreate schema on every startup (dev only)
    show-sql: false               # Never true in production — use query logging via p6spy if needed
    open-in-view: false           # Prevents lazy-loading outside transaction boundary (LazyInitializationException is a feature, not a bug)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25          # Enables JDBC batch inserts/updates
        order_inserts: true
        order_updates: true

  # ===== Flyway =====
  flyway:
    enabled: false
#    locations: classpath:db/migration
#    baseline-on-migrate: false
#    validate-on-migrate: true
#    out-of-order: false
#    repair-on-migrate: true

  # ===== Jackson =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ===== File Upload =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===== Server =====
server:
  port: 7777
  servlet:
    context-path: /api
  error:
    include-message: never        # Never expose raw exception messages to clients
    include-stacktrace: never
    include-binding-errors: never

# ===== Application-level JWT config =====
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration: 900000        # 15 minutes in ms
      refresh-token-expiration: 604800000    # 7 days in ms
  admin:
    first-name: ${ADMIN_FIRST_NAME:Admin}
    last-name: ${ADMIN_LAST_NAME:User}
    email: ${ADMIN_EMAIL:admin@visionflow.com}
    password: ${ADMIN_PASSWORD:Admin@1234}

# ===== OpenAPI / Swagger =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ===== MyBatis =====
mybatis:
  mapper-locations: classpath:mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false

# ===== Logging =====
logging:
  level:
    root: INFO
    com.visionflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
